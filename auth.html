<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login / Signup | All Ahmedabad Food Delivery</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header id="app-header"></header>
    <main class="py-5">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm">
              <div class="card-body p-4">
                <ul class="nav nav-pills mb-3" id="pills-tab" role="tablist">
                  <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login" type="button" role="tab">Login</button>
                  </li>
                  <li class="nav-item" role="presentation">
                    <button class="nav-link" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signup" type="button" role="tab">Signup</button>
                  </li>
                </ul>
                <div class="tab-content" id="pills-tabContent">
                  <div class="tab-pane fade show active" id="login" role="tabpanel">
                    <form id="login-form" class="vstack gap-3">
                      <div>
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control form-control-lg" required />
                      </div>
                      <div>
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" required />
                      </div>
                      <button class="btn btn-primary btn-lg">Login</button>
                    </form>
                  </div>
                  <div class="tab-pane fade" id="signup" role="tabpanel">
                    <form id="signup-form" class="vstack gap-3">
                      <div>
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control form-control-lg" required />
                      </div>
                      <div>
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control form-control-lg" required />
                      </div>
                      <div>
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control form-control-lg" required />
                      </div>
                      <button class="btn btn-primary btn-lg">Create Account</button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer id="app-footer" class="mt-auto"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        renderHeaderFooter('auth');
        bindAuthForms();
      });
    </script>
  </body>
  </html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurants | All Ahmedabad Food Delivery</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header id="app-header"></header>
    <main class="py-4">
      <div class="container">
        <div class="d-flex flex-column flex-md-row gap-3 align-items-stretch align-items-md-center mb-4">
          <h1 class="h3 mb-0 flex-grow-1">Restaurants</h1>
          <div class="input-group input-group-lg">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search"></i></span>
            <input id="restaurant-search" type="text" class="form-control border-start-0" placeholder="Search by name or cuisine..." />
          </div>
        </div>
        <div id="restaurant-list" class="row g-4"></div>
      </div>
    </main>
    <footer id="app-footer" class="mt-auto"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        renderHeaderFooter('restaurants');
        renderRestaurantList('restaurant-list');
        const input = document.getElementById('restaurant-search');
        input.addEventListener('input', () => filterRestaurants('restaurant-list', input.value));
      });
    </script>
  </body>
  </html>

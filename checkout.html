<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | All Ahmedabad Food Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header id="app-header"></header>
    <main class="py-4">
      <div class="container">
        <h1 class="h4 mb-4">Delivery Address</h1>
        <div class="row g-4">
          <div class="col-12 col-lg-7">
            <form id="address-form" class="vstack gap-3">
              <div class="row g-3">
                <div class="col-12 col-md-6">
                  <label class="form-label">Name</label>
                  <input type="text" class="form-control form-control-lg" id="addr-name" required />
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label">Mobile Number</label>
                  <input type="tel" class="form-control form-control-lg" id="addr-mobile" required pattern="[0-9]{10}" />
                </div>
                <div class="col-12">
                  <label class="form-label">House No & Street</label>
                  <input type="text" class="form-control form-control-lg" id="addr-line1" required />
                </div>
                <div class="col-12">
                  <label class="form-label">Area / Locality / City</label>
                  <input type="text" class="form-control form-control-lg" id="addr-city" required />
                </div>
                <div class="col-12">
                  <label class="form-label">Landmark (optional)</label>
                  <input type="text" class="form-control form-control-lg" id="addr-landmark" />
                </div>
                <div class="col-12 col-md-6">
                  <label class="form-label">Pincode</label>
                  <input type="text" class="form-control form-control-lg" id="addr-pin" required pattern="[0-9]{6}" />
                </div>
              </div>
              <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" id="save-address" checked />
                <label class="form-check-label" for="save-address">Save this address to my profile</label>
              </div>
              <button class="btn btn-primary btn-lg" id="btn-pay" onclick="syncAndPay">Proceed to Pay</button>
            </form>
          </div>
          <div class="col-12 col-lg-5">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">Order Summary</h5>
                <div id="checkout-items" class="vstack gap-3 my-3"></div>
                <div class="d-flex justify-content-between"><span>Subtotal</span><span id="co-subtotal">₹0</span></div>
                <div class="d-flex justify-content-between"><span>Delivery</span><span id="co-delivery">₹25</span></div>
                <div class="d-flex justify-content-between fw-bold border-top pt-3 mt-2"><span>Total</span><span id="co-total">₹0</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer id="app-footer" class="mt-auto"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function(){
        // Guard: logged-in + cart not empty
        const user = JSON.parse(localStorage.getItem('fg_user') || 'null');
        const cart = JSON.parse(localStorage.getItem('fg_cart') || '[]');
        if (!user) { window.location.href = 'auth.html'; return; }
        if (!cart.length) { window.location.href = 'cart.html'; return; }
        renderHeaderFooter();

        // Prefill name and maybe address
        const addr = JSON.parse(localStorage.getItem('fg_address') || 'null');
        document.getElementById('addr-name').value = user.name || '';
        if (addr) {
          document.getElementById('addr-mobile').value = addr.mobile || '';
          document.getElementById('addr-line1').value = addr.line1 || '';
          document.getElementById('addr-city').value = addr.city || '';
          document.getElementById('addr-landmark').value = addr.landmark || '';
          document.getElementById('addr-pin').value = addr.pin || '';
        }

        // Render summary
        const list = document.getElementById('checkout-items');
        const subtotal = cart.reduce((s,i)=> s + i.price * i.quantity, 0);
        list.innerHTML = cart.map(i => `
          <div class="d-flex align-items-center">
            <img src="${i.image}" class="rounded me-3" style="width:56px;height:56px;object-fit:cover" alt="${i.name}">
            <div class="flex-grow-1">
              <div class="fw-semibold">${i.name}</div>
              <div class="small text-secondary">₹${formatINR(i.price)} × ${i.quantity}</div>
            </div>
          </div>
        `).join('');
        document.getElementById('co-subtotal').textContent = '₹' + formatINR(subtotal);
        document.getElementById('co-total').textContent = '₹' + formatINR(subtotal + 25);

        document.getElementById('address-form').addEventListener('submit', function(e){
          e.preventDefault();
          const payload = {
            name: document.getElementById('addr-name').value.trim(),
            mobile: document.getElementById('addr-mobile').value.trim(),
            line1: document.getElementById('addr-line1').value.trim(),
            city: document.getElementById('addr-city').value.trim(),
            landmark: document.getElementById('addr-landmark').value.trim(),
            pin: document.getElementById('addr-pin').value.trim()
          };
          if (document.getElementById('save-address').checked) {
            localStorage.setItem('fg_address', JSON.stringify(payload));
          }
          // Start Razorpay with address in notes
          checkoutRazorpayWithAddress(payload);
        });
      });


      
  // document.addEventListener('DOMContentLoaded', () => {
  //   // 1. LocalStorage se user aur address nikaalein
  //   const user = JSON.parse(localStorage.getItem('fg_user') || '{}');
  //   const addr = JSON.parse(localStorage.getItem('fg_address') || '{}');

  //   // 2. Checkout form ke inputs mein data bharein
  //   if (user.name) document.getElementById('checkout-name').value = user.name;
  //   if (user.mobile) document.getElementById('checkout-phone').value = user.mobile;
    
  //   // Address fields bharein
  //   if (addr.line1) document.getElementById('checkout-address').value = addr.line1;
  //   if (addr.city) document.getElementById('checkout-city').value = addr.city;
  //   if (addr.pin) document.getElementById('checkout-pincode').value = addr.pin;
    
  //   console.log("✅ Checkout details pre-filled from Profile!");
  // });

    </script>

    <script>
  document.addEventListener('DOMContentLoaded', () => {
    const user = JSON.parse(localStorage.getItem('fg_user') || '{}');
    const addr = JSON.parse(localStorage.getItem('fg_address') || '{}');

    // Dhyan de: HTML mein jo ID hai wahi yahan honi chahiye
    // Agar aapke HTML mein <input id="phone"> hai, toh yahan 'phone' likhein
    const phoneField = document.getElementById('checkout-phone') || document.getElementById('phone');
    const nameField = document.getElementById('checkout-name') || document.getElementById('name');

    if (nameField) nameField.value = user.name || '';
    if (phoneField) phoneField.value = user.mobile || ''; // Profile wala mobile yahan aayega
    
    // Address fields
    const addrField = document.getElementById('checkout-address') || document.getElementById('address');
    if (addrField) addrField.value = addr.line1 || '';
  });


  async function syncAndPay() {
  const user = JSON.parse(localStorage.getItem('fg_user') || '{}');
  
  // 1. Checkout form se naya data lein
  const updatedDetails = {
    email: user.email,
    name: document.getElementById('checkout-name').value,
    mobile: document.getElementById('checkout-phone').value,
    address: {
      line1: document.getElementById('checkout-address').value,
      city: document.getElementById('checkout-city').value,
      pin: document.getElementById('checkout-pincode').value
    }
  };

  try {
    // 2. Database aur Profile ko update karein (Sync)
    const res = await fetch('/api/profile/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(updatedDetails)
    });
    
    if (res.ok) {
      const data = await res.json();
      // 3. LocalStorage update karein taaki Profile page par bhi badal jaye
      localStorage.setItem('fg_user', JSON.stringify({ name: data.name, email: data.email, mobile: data.mobile }));
      localStorage.setItem('fg_address', JSON.stringify(data.address));
      
      console.log("✅ Sync Successful! Ab payment shuru kar rahe hain...");
      
      // 4. Ab Razorpay/Stripe function call karein
      checkoutRazorpay(); 
    }
  } catch (err) {
    alert("Profile sync fail ho gaya, payment nahi ho sakti.");
  }
}
</script>

<script>
  // Page load hote hi sabse pehle check karein
  const user = JSON.parse(localStorage.getItem('fg_user') || 'null');
  if (!user) {
    alert("Order karne ke liye please pehle Login karein!");
    window.location.href = 'auth.html'; // Seedha login page par bhejein
  }
</script>
  </body>

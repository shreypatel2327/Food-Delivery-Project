<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | All Ahmedabad Food Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
    <header id="app-header"></header>
    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-6 col-lg-5">
                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <h3 class="h5 mb-3">Reset Password</h3>
                            <p class="text-secondary small mb-4">Apna registered email daalein naya password set karne ke liye.</p>
                            
                            <form id="forgot-form" class="vstack gap-3">
                                <div id="email-step">
                                    <label class="form-label">Email Address</label>
                                    <input type="email" id="forgot-email" class="form-control form-control-lg" required />
                                    <button type="submit" id="btn-verify-email" class="btn btn-primary w-100 mt-3">Verify Email</button>
                                </div>

                                <div id="password-step" style="display: none;">
                                    <div class="mb-3">
                                        <label class="form-label">New Password</label>
                                        <input type="password" id="new-password" class="form-control form-control-lg" required />
                                    </div>
                                    <button type="submit" class="btn btn-success w-100">Update Password</button>
                                </div>
                            </form>
                            
                            <div class="mt-3 text-center">
                                <a href="auth.html" class="small text-decoration-none">Back to Login</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer id="app-footer" class="mt-auto"></footer>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderHeaderFooter();
            bindForgotForm(); // Ye function hum assets/js/app.js mein add karenge
        });
    </script>
</body>
</html>

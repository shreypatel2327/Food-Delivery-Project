<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>My Profile | Food Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header id="app-header"></header>
    <main class="py-5">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div class="card shadow">
                        <div class="card-body p-4">
                            <h3>My Profile</h3>
                            <form id="profile-form" class="row g-3 mt-3">
                                <div class="col-md-6">
                                    <label class="form-label">Full Name</label>
                                    <input type="text" id="prof-name" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Mobile Number</label>
                                    <input type="tel" id="prof-mobile" class="form-control" required pattern="[0-9]{10}">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Address (House No, Building, Street)</label>
                                    <input type="text" id="prof-line1" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">City / Area</label>
                                    <input type="text" id="prof-city" class="form-control" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label">Pincode</label>
                                    <input type="text" id="prof-pin" class="form-control" required pattern="[0-9]{6}">
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-primary">Save Profile</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer id="app-footer"></footer>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderHeaderFooter();
            loadProfileData(); // Profile load karne ka function
            bindProfileForm(); // Save karne ka logic
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Menu | All Ahmedabad Food Delivery</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header id="app-header"></header>
    <main class="py-4">
      <div class="container">
        <div id="restaurant-hero" class="mb-4"></div>
        <div class="row g-4">
          <div class="col-12 col-lg-8">
            <div id="menu-items" class="row g-4"></div>
          </div>
          <div class="col-12 col-lg-4">
            <div class="card sticky-top" style="top: 90px;">
              <div class="card-body">
                <h5 class="card-title d-flex justify-content-between align-items-center">Your Cart <span class="badge bg-primary" id="cart-count">0</span></h5>
                <div id="cart-items" class="vstack gap-3 my-3"></div>
                <div class="d-flex justify-content-between fw-bold border-top pt-3">
                  <span>Total</span>
                  <span id="cart-total">$0.00</span>
                </div>
                <a href="cart.html" class="btn btn-primary w-100 mt-3">Go to Checkout</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer id="app-footer" class="mt-auto"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        renderHeaderFooter('restaurants');
        renderMenuPage();
        renderMiniCart('cart-items', 'cart-total', 'cart-count');
      });
    </script>
  </body>
  </html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us | All Ahmedabad Food Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
    <header id="app-header"></header>

    <main class="container py-5">
        <div class="row g-5">
            <div class="col-md-4">
                <h2 class="fw-bold mb-4">Get in Touch</h2>
                <div class="d-flex mb-3">
                    <i class="bi bi-geo-alt-fill text-primary me-3 h4"></i>
                    <p>Vastral, Ahmedabad, Gujarat - 382418</p>
                </div>
                <div class="d-flex mb-3">
                    <i class="bi bi-envelope-fill text-primary me-3 h4"></i>
                    <p>support@ahmedabadfood.com</p>
                </div>
                <div class="d-flex mb-3">
                    <i class="bi bi-telephone-fill text-primary me-3 h4"></i>
                    <p>+91 98765 43210</p>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form id="contact-form">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">Name</label>
                                    <input type="text" id="con-name" class="form-control" placeholder="Aapka Naam" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Email</label>
                                    <input type="email" id="con-email" class="form-control" placeholder="Aapka Email" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Subject</label>
                                    <input type="text" id="con-subject" class="form-control" placeholder="Topic">
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Message</label>
                                    <textarea id="con-message" class="form-control" rows="5" placeholder="Write your message here..." required></textarea>
                                </div>
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary px-5">Send Message</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="app-footer"></footer>

    <script src="assets/js/layout.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderHeaderFooter('contact'); // layout.js se navbar load karega
            bindContactForm(); // Message save karne ki logic
        });
    </script>
</body>
</html>

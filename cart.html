<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | All Ahmedabad Food Delivery</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header id="app-header"></header>
    <main class="py-4">
      <div class="container">
        <h1 class="h3 mb-4">Your Cart</h1>
        <div class="row g-4">
          <div class="col-12 col-lg-8">
            <div id="cart-page-items" class="vstack gap-3"></div>
          </div>
          <div class="col-12 col-lg-4">
            <div class="card">
              <div class="card-body">
                <h5 class="card-title">Order Summary</h5>
                <div class="d-flex justify-content-between"><span>Subtotal</span><span id="summary-subtotal">₹0</span></div>
                <div class="d-flex justify-content-between"><span>Delivery</span><span id="summary-delivery">₹0</span></div>
                <div class="d-flex justify-content-between fw-bold border-top pt-3 mt-2"><span>Total</span><span id="summary-total">₹0</span></div>
                <a class="btn btn-primary w-100 mt-3" id="btn-go-checkout" href="checkout.html">Checkout</a>
                <button class="btn btn-outline-secondary w-100 mt-2" id="btn-checkout-rzp" style="display:none;">Pay with Razorpay (India)</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer id="app-footer" class="mt-auto"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        renderHeaderFooter('cart');
        renderCartPage('cart-page-items', 'summary-subtotal', 'summary-delivery', 'summary-total');
        document.getElementById('btn-checkout').addEventListener('click', () => {
          checkout();
        });
        const rzpBtn = document.getElementById('btn-checkout-rzp');
        if (rzpBtn) {
          rzpBtn.addEventListener('click', () => checkoutRazorpay());
        }
      });
    </script>
  </body>
  </html>

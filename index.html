<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Ahmedabad Food Delivery | Delicious food delivered fast</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header id="app-header"></header>

    <main>
      <!-- Hero Section -->
      <section class="hero d-flex align-items-center">
        <div class="container">
          <div class="row align-items-center">
            <div class="col-lg-7">
              <h1 class="display-5 fw-bold mb-3">Delicious food delivered fast</h1>
              <p class="lead mb-4">Discover top restaurants near you and get your favorites delivered in minutes.</p>
              <a href="restaurants.html" class="btn btn-primary btn-lg me-2">Explore Restaurants</a>
              <a href="cart.html" class="btn btn-outline-light btn-lg">View Cart</a>
            </div>
            <div class="col-lg-5 text-center d-none d-lg-block">
              <img src="https://images.unsplash.com/photo-1544025162-d76694265947?q=80&w=1200&auto=format&fit=crop" class="img-fluid hero-img rounded-4 shadow" alt="Food delivery" loading="lazy" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1498837167922-ddd27525d352?q=80&w=1200&auto=format&fit=crop';" />
            </div>
          </div>
        </div>
      </section>

      <!-- Featured Restaurants -->
      <section class="py-5 bg-light">
        <div class="container">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h3 mb-0">Featured Restaurants</h2>
            <a href="restaurants.html" class="text-primary fw-semibold">See all</a>
          </div>
          <div id="featured-restaurants" class="row g-4"></div>
        </div>
      </section>

      <!-- Popular Dishes -->
      <section class="py-5">
        <div class="container">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h3 mb-0">Popular Dishes</h2>
            <a href="restaurants.html" class="text-primary fw-semibold">Order now</a>
          </div>
          <div id="popular-dishes" class="row g-4"></div>
        </div>
      </section>
    </main>

    <footer id="app-footer" class="mt-auto"></footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/layout.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        renderHeaderFooter('home');
        renderFeaturedRestaurants('featured-restaurants', 6);
        renderPopularDishes('popular-dishes', 6);
      });
    </script>
  </body>
  </html>

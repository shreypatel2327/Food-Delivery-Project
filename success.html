<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Success | All Ahmedabad Food Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous" />
    <link rel="stylesheet" href="assets/css/styles.css" />
  </head>
  <body>
    <header id="app-header"></header>
    <main class="py-5">
      <div class="container text-center">
        <h1 class="h3 mb-3">Order Confirmed!</h1>
        <p>Your payment was successful and we’re preparing your food.</p>
        <div id="delivery-details" class="mt-3"></div>
        <a href="index.html" class="btn btn-primary mt-3">Back to Home</a>
      </div>
    </main>
    <footer id="app-footer" class="mt-auto"></footer>
    <script src="assets/js/layout.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded',()=>{
        renderHeaderFooter();
        const addr = JSON.parse(localStorage.getItem('fg_last_order_address')||'null') || JSON.parse(localStorage.getItem('fg_address')||'null');
        if (addr) {
          const d = document.getElementById('delivery-details');
          d.innerHTML = `<div class="card d-inline-block text-start"><div class="card-body"><div class="fw-semibold">Delivery to</div><div>${addr.name || ''}</div><div>${addr.line1 || ''}, ${addr.city || ''} - ${addr.pin || ''}</div><div class="text-secondary small">Mobile: ${addr.mobile || ''}${addr.landmark?`, Landmark: ${addr.landmark}`:''}</div></div></div>`;
        }
      });
    </script>
  </body>
  </html>
